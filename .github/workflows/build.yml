name: Build Windows VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A x64
      - run: cmake --build build --config Release --target YokokoOnonoPitchDelayV4_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: YokokoOnono-v4-VST3
          path: build/YokokoOnonoPitchDelayV4_artefacts/Release/VST3/
